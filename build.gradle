plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ru.homeserver.photoshare'
version = '0.0.1-SNAPSHOT'
description = 'homeserver'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.xerial:sqlite-jdbc:3.53.4.0'
    implementation "com.drewnoakes:metadata-extractor:2.19.0"
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'com.github.ua-parser:uap-java:1.6.1'
    implementation 'com.bucket4j:bucket4j_jdk17-core:8.18.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('frontendTest', Exec) {
    description = 'Run frontend regression tests (requires Node.js 20+).'
    group = 'verification'
    commandLine 'node', '--test', 'src/test/js/frontend.test.cjs', 'src/test/js/styles.test.cjs'
}

tasks.named('check') {
    dependsOn 'frontendTest'
}
